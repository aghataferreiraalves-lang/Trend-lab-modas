<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café & Charme</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5ebdd;
            color: #49352a;
            text-align: center;
        }

        header {
            background: #251b18;
            color: white;
            padding: 30px;
        }

        header h1 {
            color: #f5d6a5;
        }

        .banner {
            padding: 50px 20px;
            background: #49352a;
            color: white;
        }

        .banner h2 {
            font-size: 30px;
        }

        button {
            background: #d6a66c;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
        }

        .cardapio {
            padding: 30px;
        }

        .item {
            background: white;
            margin: 12px auto;
            padding: 15px;
            max-width: 300px;
            border-radius: 12px;
        }

        footer {
            background: #251b18;
            color: white;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>☕ Café & Charme</h1>
        <p>Um cantinho especial para você!</p>
    </header>

    <section class="banner">
        <h2>Seu momento, seu café.</h2>
        <p>Venha conhecer nossa cafeteria!</p>
        <button onclick="alert('Seja bem-vindo ao Café & Charme!')">
            Conhecer
        </button>
    </section>

    <section class="cardapio">
        <h2>Nosso cardápio</h2>

        <div class="item">
            <h3>☕ Cappuccino</h3>
            <p>R$ 12,00</p>
        </div>

        <div class="item">
            <h3>🍫 Chocolate quente</h3>
            <p>R$ 10,00</p>
        </div>

        <div class="item">
            <h3>🥐 Croissant</h3>
            <p>R$ 9,00</p>
        </div>
    </section>

    <footer>
        <h3>Esperamos você! ❤️</h3>
        <p>© 2026 Café & Charme</p>
    </footer>

</body>
</html>
